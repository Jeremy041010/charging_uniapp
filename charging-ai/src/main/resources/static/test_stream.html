<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老李充电桩智能客服</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1890ff;
            --primary-light: #e6f7ff;
            --success-color: #52c41a;
            --error-color: #ff4d4f;
            --text-color: #333;
            --text-secondary: #666;
            --bg-color: #f5f7fa;
            --card-bg: #fff;
            --border-color: #eee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            margin: 0;
            background: var(--card-bg);
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            background: #fff;
            border-right: 1px solid var(--border-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .new-chat-btn {
            margin: 12px 16px;
            padding: 8px 0;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .history-section {
            padding: 0 16px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            flex: 1;
            overflow-y: auto;
        }
        .history-title {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-history-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .clear-history-btn:hover {
            color: var(--error-color);
        }

        .history-item {
            padding: 8px 0;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
        }
        .history-item.active {
            color: var(--primary-color);
            background: var(--primary-light);
            padding-left: 8px;
            border-left: 2px solid var(--primary-color);
        }
        .history-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-color);
        }

        .chat-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .message {
            max-width: 70%;
            margin-bottom: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            clear: both;
        }
        .message.user {
            background: var(--primary-color);
            color: white;
            float: right;
        }
        .message.ai {
            background: white;
            color: var(--text-color);
            float: left;
            border: 1px solid var(--border-color);
        }
        .message.system {
            max-width: 100%;
            float: none;
            background: var(--primary-light);
            color: var(--primary-color);
            margin: 0 auto 16px;
            text-align: center;
        }
        .message.error {
            max-width: 100%;
            float: none;
            background: #fff2f0;
            color: var(--error-color);
            margin: 0 auto 16px;
            text-align: center;
        }

        .input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        textarea {
            width: 100%;
            min-height: 60px;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            resize: none;
            font-size: 14px;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .button-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-secondary {
            background: #f5f7fa;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        .btn-danger {
            background: #fff2f0;
            color: var(--error-color);
            border: 1px solid #ffccc7;
        }
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 10px 14px;
            background: white;
            border-radius: 8px;
            float: left;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: bounce 1.4s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-charging-station"></i>
                老李充电桩智能客服
            </div>
            <div class="logo-desc">基于SPRING AI ALIBABA</div>
        </div>

        <button class="new-chat-btn" onclick="createNewChat()">
            <i class="fas fa-plus"></i>
            新建会话
        </button>

        <div class="history-section">
            <div class="history-title">
                <span>对话历史</span>
                <button class="clear-history-btn" onclick="clearAllHistory()">
                    <i class="fas fa-trash"></i>
                    清空历史
                </button>
            </div>
            <div class="history-list" id="historyList">
                <!-- 历史记录动态生成 -->
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="output">
            <div class="message system">
                已创建新对话，您可以开始提问了。
            </div>
        </div>

        <div class="input-area">
                <textarea
                        id="messageInput"
                        placeholder="请输入您的问题，例如：附近有优惠充电桩吗？"
                ></textarea>

            <div class="button-group">
                <button class="btn btn-secondary" onclick="insertExample()">
                    <i class="fas fa-lightbulb"></i>
                    示例
                </button>
                <button class="btn btn-secondary" onclick="clearInput()">
                    <i class="fas fa-eraser"></i>
                    清空
                </button>
                <button class="btn btn-secondary" onclick="testGatewayConnection()">
                    <i class="fas fa-network-wired"></i>
                    测试网关
                </button>
                <button class="btn btn-secondary" onclick="testAiHealth()">
                    <i class="fas fa-heartbeat"></i>
                    健康检查
                </button>
                <button class="btn btn-danger" onclick="stopStream()" id="stopBtn" disabled>
                    <i class="fas fa-stop"></i>
                    停止
                </button>
                <button class="btn btn-primary" onclick="startStream()" id="startBtn">
                    <i class="fas fa-paper-plane"></i>
                    发送
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let eventSource = null;
    let chatHistory = [];
    let activeChatId = null;
    let currentAiMessageElement = null;
    let isTyping = false;
    let messageCount = 0;

    // 核心配置：网关地址（和第一个页面保持一致）
    const GATEWAY_BASE_URL = 'http://localhost:7070';

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        loadChatHistory();
        document.getElementById('messageInput').focus();

        // 回车键发送（支持shift+enter换行）
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                startStream();
            }
        });
    });

    // 创建新对话
    function createNewChat() {
        activeChatId = 'chat_' + Date.now();
        chatHistory.push({
            id: activeChatId,
            title: '新对话',
            timestamp: new Date(),
            messages: []
        });
        saveChatHistory();
        renderChatHistory();
        clearChatWindow();
        addMessage('已创建新对话，您可以开始提问了。', 'system');
    }

    // 加载聊天历史
    function loadChatHistory() {
        const saved = localStorage.getItem('chatHistory');
        if (saved) {
            chatHistory = JSON.parse(saved);
            // 按时间升序排列
            chatHistory.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            if (chatHistory.length > 0) {
                activeChatId = chatHistory[chatHistory.length - 1].id;
                renderChatHistory();
                loadChat(activeChatId);
            } else {
                createNewChat();
            }
        } else {
            createNewChat();
        }
    }

    // 保存聊天历史
    function saveChatHistory() {
        localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    }

    // 渲染历史列表
    function renderChatHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        chatHistory.forEach(chat => {
            const item = document.createElement('div');
            item.className = `history-item ${chat.id === activeChatId ? 'active' : ''}`;
            item.onclick = () => loadChat(chat.id);
            item.innerHTML = `
                ${chat.title}
                <div class="history-time">${formatTime(chat.timestamp)}</div>
            `;
            list.appendChild(item);
        });
    }

    // 加载指定对话
    function loadChat(chatId) {
        activeChatId = chatId;
        const chat = chatHistory.find(c => c.id === chatId);
        if (chat) {
            clearChatWindow();
            chat.messages.forEach(msg => addMessage(msg.content, msg.type, false));
            renderChatHistory();
        }
    }

    // 清空聊天窗口
    function clearChatWindow() {
        document.getElementById('output').innerHTML = '';
        messageCount = 0;
    }

    // 格式化时间
    function formatTime(dateStr) {
        const date = new Date(dateStr);
        const now = new Date();
        const diff = now - date;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));

        if (days === 0) {
            return '今天 ' + date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
        } else if (days === 1) {
            return '昨天 ' + date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
        } else {
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
        }
    }

    // 添加消息（核心优化：支持保存到历史）
    function addMessage(content, type, saveToHistory = true) {
        const output = document.getElementById('output');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.textContent = content;

        // 清除浮动
        const clearDiv = document.createElement('div');
        clearDiv.style.clear = 'both';

        output.appendChild(msgDiv);
        output.appendChild(clearDiv);
        output.scrollTop = output.scrollHeight;

        // 保存到当前对话
        if (saveToHistory && activeChatId) {
            const currentChat = chatHistory.find(c => c.id === activeChatId);
            if (currentChat && type !== 'system') {
                currentChat.messages.push({content, type});
                // 更新对话标题（使用第一个用户消息）
                if (type === 'user' && currentChat.title === '新对话') {
                    currentChat.title = content.length > 15 ? content.substring(0, 15) + '...' : content;
                }
                saveChatHistory();
                renderChatHistory();
            }
        }
        messageCount++;
        return msgDiv;
    }

    // 显示打字中动画
    function showTypingIndicator() {
        if (isTyping) return;

        const output = document.getElementById('output');
        const indicator = document.createElement('div');
        indicator.id = 'typingIndicator';
        indicator.className = 'typing-indicator';
        indicator.innerHTML = `
            思考中
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        `;

        const clearDiv = document.createElement('div');
        clearDiv.style.clear = 'both';

        output.appendChild(indicator);
        output.appendChild(clearDiv);
        output.scrollTop = output.scrollHeight;
        isTyping = true;
    }

    // 隐藏打字中动画
    function hideTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) {
            indicator.remove();
        }
        isTyping = false;
    }

    // 发送消息（核心：完整的SSE处理逻辑）
    function startStream() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();

        if (!content) {
            alert('请输入问题内容！');
            return;
        }

        // 按钮状态控制
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;

        // 显示用户消息
        addMessage(content, 'user');
        input.value = '';
        showTypingIndicator();

        // 关闭现有连接
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }

        try {
            // 核心：走网关的/ai_api路径，和第一个页面保持一致
            const encodedMessage = encodeURIComponent(content);
            const sseUrl = `${GATEWAY_BASE_URL}/ai_api/ai/bailian/agent/stream?message=${encodedMessage}`;
            console.log('SSE请求地址：', sseUrl);

            eventSource = new EventSource(sseUrl);

            // 连接成功
            eventSource.onopen = () => {
                console.log('SSE连接成功');
                hideTypingIndicator();
                // 创建空的AI消息元素用于接收流式内容
                currentAiMessageElement = addMessage('', 'ai', false);
            };

            // 接收流式消息
            eventSource.onmessage = (e) => {
                console.log('接收SSE消息：', e.data);
                if (currentAiMessageElement && e.data.trim()) {
                    // 拼接流式内容
                    currentAiMessageElement.textContent += e.data;
                    // 自动滚动到底部
                    document.getElementById('output').scrollTop = document.getElementById('output').scrollHeight;
                }
            };

            // 连接错误/关闭处理
            eventSource.onerror = (err) => {
                console.error('SSE错误:', err);
                hideTypingIndicator();

                // 处理空回复情况
                if (currentAiMessageElement && !currentAiMessageElement.textContent.trim()) {
                    addMessage('老李: 很抱歉，处理你的问题时发生异常，请稍后重试！', 'error');
                    currentAiMessageElement.remove();
                } else if (currentAiMessageElement) {
                    // 保存AI消息到历史
                    const aiContent = currentAiMessageElement.textContent.trim();
                    if (aiContent) {
                        const currentChat = chatHistory.find(c => c.id === activeChatId);
                        if (currentChat) {
                            currentChat.messages.push({content: aiContent, type: 'ai'});
                            saveChatHistory();
                            renderChatHistory();
                        }
                    }
                }

                // 恢复按钮状态
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;

                // 清理资源
                eventSource.close();
                eventSource = null;
                currentAiMessageElement = null;
            };

        } catch (err) {
            console.error('创建SSE连接失败:', err);
            hideTypingIndicator();
            addMessage('连接失败：' + err.message, 'error');

            // 恢复按钮状态
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    }

    // 停止接收消息
    function stopStream() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }

        hideTypingIndicator();
        currentAiMessageElement = null;

        // 恢复按钮状态
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;

        addMessage('已手动停止接收消息', 'system');
    }

    // 清空输入框
    function clearInput() {
        document.getElementById('messageInput').value = '';
    }

    // 插入示例问题
    function insertExample() {
        const examples = [
            "充电桩怎么使用？",
            "汽车保养需要注意什么？",
            "附近有优惠充电桩吗？",
            "你的功能有哪些？",
            "充电桩的收费标准是什么？",
            "老李你好，介绍一下充电桩的安全使用规范"
        ];
        document.getElementById('messageInput').value = examples[Math.floor(Math.random() * examples.length)];
    }

    // 测试网关连接（走网关路径）
    function testGatewayConnection() {
        fetch(`${GATEWAY_BASE_URL}/ai_api/ai/test`)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP错误：${res.status}`);
                return res.text();
            })
            .then(data => {
                addMessage(`网关连接测试成功：${data}`, 'system');
            })
            .catch(err => {
                console.error('网关测试失败:', err);
                addMessage(`网关连接测试失败：${err.message}，请检查网关是否启动`, 'error');
            });
    }

    // AI服务健康检查（走网关路径）
    function testAiHealth() {
        fetch(`${GATEWAY_BASE_URL}/ai_api/ai/health`)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP错误：${res.status}`);
                return res.json();
            })
            .then(data => {
                addMessage(`AI服务健康状态：${JSON.stringify(data, null, 2)}`, 'system');
            })
            .catch(err => {
                console.error('健康检查失败:', err);
                addMessage(`健康检查失败：${err.message}`, 'error');
            });
    }

    // 清空所有历史
    function clearAllHistory() {
        if (confirm('确定清空所有对话历史吗？')) {
            chatHistory = [];
            localStorage.removeItem('chatHistory');
            createNewChat();
        }
    }

    // 页面关闭时清理连接
    window.addEventListener('beforeunload', function() {
        if (eventSource) {
            eventSource.close();
        }
    });
</script>
</body>
</html>
